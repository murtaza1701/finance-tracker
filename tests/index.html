<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pengeflyt · Unit tests</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    body { margin: 32px auto; max-width: 820px; padding: 0 16px; font: 15px/1.5 system-ui, sans-serif; color: #0b0b0b; background: #fcfcfb; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    .summary { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
    .summary.pass { color: #006300; }
    .summary.fail { color: #b42828; }
    ol { padding-left: 24px; }
    li { margin: 3px 0; }
    li::marker { color: #898781; }
    .ok::before { content: "✓ "; color: #006300; font-weight: 700; }
    .failed { color: #b42828; }
    .failed::before { content: "✗ "; font-weight: 700; }
    .error { display: block; font: 13px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Pengeflyt unit tests</h1>
  <p class="summary" id="summary">Running…</p>
  <ol id="results"></ol>
  <script type="module">
    import { run } from './harness.js';
    import './all.js';

    const results = await run();
    const list = document.getElementById('results');
    for (const result of results) {
      const item = document.createElement('li');
      item.className = result.ok ? 'ok' : 'failed';
      item.textContent = result.name;
      if (!result.ok) {
        const error = document.createElement('span');
        error.className = 'error';
        error.textContent = result.error;
        item.append(error);
      }
      list.append(item);
    }
    const failed = results.filter((result) => !result.ok).length;
    const summary = document.getElementById('summary');
    summary.textContent = `${results.length - failed} passed, ${failed} failed`;
    summary.className = `summary ${failed ? 'fail' : 'pass'}`;
  </script>
</body>
</html>
